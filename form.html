<html lang="es">
<head>
<title> Inscripcion a Equipo</title>

<style>
body{
  background: pink;
}

.imgFormulario{
	display: block;
	margin: 20px auto;
	padding: 20px;
	
}

.formDiv{
  margin: 40px auto;
  width: 600px;
  background: white;
  padding: 20px;
  border-radius: 10px;
}


.form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.form input,
.form select {
  padding: 10px;
  border-radius: 4px;
  font-size: 15px;
}


.form label {
  font-weight: bold;
}
</style>

</head>

<body>

<main id="main" class="formulario">

<div class="formDiv">
   
  <img src="img/diagram-project-svgrepo-com.svg" alt="Logo de proyecto" width="60" height="60" class="imgFormulario"/>
  <h1>Formulario de inscripción al Equipo 2026</h1>

  <form autocomplete="off" class="form">

    <label for="studentId">Carnet Estudiante:</label>
    <input type="text" id="studentId" required />

    <label for="studentName">Nombre Estudiante:</label>
    <input type="text" id="studentName" required />

    <label for="studentAge">Año Nacimiento:</label>
    <input type="date" id="studentAge" required min="2010-01"/>

    <label for="selectTeamId">Selección de Equipo:</label>
    <select id="selectTeamId">
      <option value="1">Barcelona</option>
      <option value="2">Real Madrid</option>
      <option value="3">Curacao</option>
    </select>

  </form>
</div>

</main>

</body>
</html>
